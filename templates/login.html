{% extends "base.html" %}
{% block title %}Login — BloodBridge{% endblock %}
{% block content %}
<div class="auth narrow">
  <div><span class="eyebrow">WELCOME BACK</span><h1>Login</h1><p>Access your donor or admin dashboard.</p></div>
  <form method="post" class="form-card">
    <label>Email<input type="email" name="email" required></label>
    <label>Password<input type="password" name="password" required></label>
    <button class="btn">Login</button>
    <p class="muted">Demo admin: admin@bloodbridge.local / admin123</p>
  </form>
</div>
{% endblock %}
